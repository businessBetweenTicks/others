<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nura — contest submission</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=Instrument+Sans:wght@400;500&display=swap">
<style>
  :root{--ground:#F7F3ED;--hairline:#E2DAD0;--mute:#D9CFC3;--ink:#1C1A17;--ink2:#55504A;--ink3:#8A8279;--plum:#4E2A44;--moss:#6E7A61;
        --serif:'Newsreader',Georgia,serif;--sans:'Instrument Sans',Helvetica,Arial,sans-serif}
  *{box-sizing:border-box} html,body{margin:0}
  body{width:1400px;height:900px;background:var(--ground);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;padding:64px 88px 56px;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .lbl{font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}

  .top{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--ink)}
  .top .mark{font-family:var(--serif);font-size:28px;letter-spacing:.02em}

  .mid{margin:auto 0;padding:24px 0}
  h1{font-family:var(--serif);font-weight:400;font-size:92px;line-height:1.0;letter-spacing:-.03em;margin:0;max-width:920px}
  h1 em{font-style:italic}
  .one{font-size:21px;line-height:1.6;color:var(--ink2);margin:30px 0 0;max-width:740px}

  .link{margin-top:48px;background:var(--plum);border-radius:2px;padding:36px 44px}
  .link .u{display:block;font-family:var(--serif);font-size:38px;line-height:1.2;letter-spacing:-.02em;color:var(--ground)}

  .foot{padding-top:22px;border-top:1px solid var(--hairline);display:flex;align-items:center;justify-content:space-between;gap:32px}
  .foot span{font-size:14px;color:var(--ink3)}
  .sw{display:flex;gap:7px}
  .sw i{width:15px;height:20px;border-radius:2px}
</style>
</head>
<body>

  <div class="top">
    <span class="mark">Nura</span>
    <span class="lbl">Gift site &middot; contest submission</span>
  </div>

  <div class="mid">
    <h1>A gift that does the work <em>for her.</em></h1>
    <p class="one">Ten sections, four breakpoints, the six gift-flow screens, and the motion running rather than described.</p>
  </div>

  <div class="link">
    <span class="u">The site is live. The link is in the description.</span>
  </div>

  <div class="foot" style="margin-top:48px">
    <span>Newsreader &middot; Instrument Sans</span>
    <span class="sw">
      <i style="background:#1C1A17"></i><i style="background:#4E2A44"></i><i style="background:#6E7A61"></i>
      <i style="background:#EFE9E0"></i><i style="background:#FFFDFA;border:1px solid var(--hairline)"></i>
    </span>
    <span>Grisaille Labs</span>
  </div>

</body>
</html>
