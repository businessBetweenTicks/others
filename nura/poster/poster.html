<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nura — contest submission</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=Instrument+Sans:wght@400;500&display=swap">
<style>
  :root{--ground:#F7F3ED;--mute:#D9CFC3;--ink:#1C1A17;--plum:#4E2A44;
        --serif:'Newsreader',Georgia,serif;--sans:'Instrument Sans',Helvetica,Arial,sans-serif}
  *{box-sizing:border-box} html,body{margin:0}
  body{width:1400px;height:900px;background:var(--ground);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;padding:96px 88px;display:flex;flex-direction:column;justify-content:center;gap:72px}
  a{color:inherit;text-decoration:none}
  h1{font-family:var(--serif);font-weight:400;font-size:104px;line-height:1.0;
     letter-spacing:-.03em;margin:0;max-width:1040px}
  h1 em{font-style:italic}
  .link{background:var(--plum);border-radius:2px;padding:44px 48px}
  .link .l{display:block;font-size:13px;font-weight:500;letter-spacing:.18em;
           text-transform:uppercase;color:var(--mute)}
  .link .u{display:block;font-family:var(--serif);font-size:56px;line-height:1.1;
           letter-spacing:-.02em;color:var(--ground);word-break:break-all}
</style>
</head>
<body>
  <h1>Live Submission</h1>
  <a class="link" href="https://nuracontest.netlify.app">
    <span class="u">nuracontest.netlify.app</span>
  </a>
</body>
</html>
