<div style="width:375px;min-height:815px;background:#F7F3ED;color:#1C1A17;box-sizing:border-box;display:flex;flex-direction:column;">

        </div></div>
      </div>

        <div style="display:flex;flex-direction:column;gap:9px;">
          <div style="font-size:11px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#8A8279;">Name on card</div>
          <div style="font-size:16.5px;color:#1C1A17;padding-bottom:11px;border-bottom:1px solid #1C1A17;">P. Raman</div>

    <div style="font-size:13px;line-height:1.62;color:#55504A;padding-top:20px;border-top:1px solid #E2DAD0;">Stripe takes the payment. Nura never sees your card, and her people never see what you gave.</div>
